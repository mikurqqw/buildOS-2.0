name: BuildOS checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buildos
          POSTGRES_PASSWORD: buildos_ci_only
          POSTGRES_DB: buildos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buildos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://buildos:buildos_ci_only@localhost:5432/buildos?schema=public
      DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm test
      - run: npm run typecheck
      - run: node --import tsx --test --test-concurrency=1 tests/integration/*.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
